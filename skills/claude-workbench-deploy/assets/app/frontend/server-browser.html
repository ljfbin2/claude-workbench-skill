<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务器浏览器  Claude Code工作台</title><link rel="icon" href="/static/claude-code-v1.svg"><link rel="stylesheet" href="/static/server-browser-v1.css"><script type="module" src="/static/server-browser-v1.js"></script></head><body>
<header><div class="brand"><img src="/static/claude-code-v1.svg" alt="" width="30" height="30"><div><strong>服务器浏览器</strong><small>画面与网页访问均在服务器运行</small></div></div><nav aria-label="浏览器操作"><button id="open-claude">Claude 官网</button><button id="open-billing">订阅与账单</button><button id="reconnect">重新连接</button><button id="clipboard-open">剪贴板</button><a href="/">返回工作台</a></nav></header>
<div class="status-line"><span id="connection" role="status">正在连接服务器</span><span id="feedback" role="status"></span></div>
<details id="account-panel"><summary>Claude Code 官方授权</summary><div class="account-controls"><p>网页登录与 Claude Code 授权分别管理。仅在需要重新授权时启动；授权期间暂停接收新的编程任务，发送失败的草稿会保留。订阅和付款请在官方页面核对后确认。</p><div class="actions"><button id="auth-start">启动官方授权</button><button id="auth-open" hidden>重新打开授权页</button><button id="auth-cancel" hidden>取消本次授权</button><span id="auth-status" role="status"></span></div><form id="auth-code-form" hidden><label>若官方页面显示一次性代码<input id="auth-code" type="password" maxlength="4096" autocomplete="off" placeholder="直接在这里粘贴，不发送到聊天"></label><button type="button" id="code-from-remote">使用远程复制的代码</button><button type="submit">提交授权码</button></form></div></details>
<main id="screen" aria-label="服务器远程浏览器画面"></main>
<dialog id="clipboard-dialog"><form method="dialog"><h2>远程剪贴板</h2><p>把内容粘贴到这里并发送，然后在远程浏览器中按 Ctrl+V。远程页面中复制的内容也会显示在此处。</p><textarea id="clipboard-text" rows="5" aria-label="剪贴板内容"></textarea><div class="actions"><button type="button" id="clipboard-send">发送到远程剪贴板</button><button value="close">关闭</button></div></form></dialog>
</body></html>
